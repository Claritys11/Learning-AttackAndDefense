[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attnndef"
version = "0.1.0"
description = "Local-only attack and defense training orchestration"
requires-python = ">=3.11"

[project.scripts]
attnndef = "attnndef.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
