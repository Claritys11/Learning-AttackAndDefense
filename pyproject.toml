[project]
name = "attnndef"
version = "0.1.0"
description = "Local-fixture attack/defense orchestration scaffolding for CTF A/D practice"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
